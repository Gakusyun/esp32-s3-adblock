; ESP32-S3 (N16R8: 16MB flash + 8MB octal PSRAM) — this fork's only target.
; The original C3/esp32dev environments were removed: the partition table and
; USB/serial setup below are specific to this board.
[platformio]
default_envs = s3

[env]
; Pinned: the firmware uses Arduino core 3.x APIs (rgbLedWrite, the NetworkClientSecure
; CA bundle), so an unpinned platform silently changes the toolchain under it.
platform = espressif32@8.0.0
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
monitor_speed = 115200
; 提醒 data/index.html.gz 缺失（面板是 web/ 的构建产物，不入库）
extra_scripts = pre:tools/check_panel.py

[env:s3]
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.flash_mode = qio
; N16R8 = octal PSRAM. Enabling it keeps RAM pressure irrelevant even for
; multi-hundred-thousand-domain lists (hashes are sorted in PSRAM).
board_build.arduino.memory_type = qio_opi
; TLS runs on the Arduino loop task when DoH is enabled (mbedTLS handshake + the DNS
; forwarding frame). The default 8 KB stack is uncomfortably close, and a stack
; overflow here reboots the device, so give it 16 KB (the RAM comes from the heap).
build_flags = -DARDUINO_LOOP_STACK_SIZE=16384
; This board is reached through its on-board USB-UART bridge (CH343 -> /dev/ttyACM0);
; there is no native USB-Serial-JTAG port, so Serial stays on UART0 (GPIO43/44).
; ARDUINO_USB_CDC_ON_BOOT defaults to 0, which is exactly what we want; overriding
; the board's ARDUINO_USB_MODE=1 flag here only produced redefinition warnings.
upload_speed = 460800
