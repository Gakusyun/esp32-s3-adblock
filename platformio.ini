; ESP32-S3 (N16R8: 16MB flash + 8MB octal PSRAM) — this fork's only target.
; The original C3/esp32dev environments were removed: the partition table and
; USB/serial setup below are specific to this board.
[platformio]
default_envs = s3

[env]
platform = espressif32
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
monitor_speed = 115200

[env:s3]
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.flash_mode = qio
; N16R8 = octal PSRAM. Enabling it keeps RAM pressure irrelevant even for
; multi-hundred-thousand-domain lists (hashes are sorted in PSRAM).
board_build.arduino.memory_type = qio_opi
; This board is reached through its on-board USB-UART bridge (CH343 -> /dev/ttyACM0);
; there is no native USB-Serial-JTAG port, so Serial stays on UART0 (GPIO43/44).
; ARDUINO_USB_CDC_ON_BOOT defaults to 0, which is exactly what we want; overriding
; the board's ARDUINO_USB_MODE=1 flag here only produced redefinition warnings.
upload_speed = 460800
